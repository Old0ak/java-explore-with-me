# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0441\u0435\u0440\u0432\u0435\u0440\u0430
server.port=8080

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6541/ewm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 Hibernate \u0438 SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# \u0412\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u0435 \u043E\u0442\u043E\u0431\u0440\u0430\u0436\u0435\u043D\u0438\u044F SQL-\u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432 \u0432 \u043A\u043E\u043D\u0441\u043E\u043B\u0438 (\u0434\u043B\u044F \u043E\u0442\u043B\u0430\u0434\u043A\u0438)
spring.jpa.show-sql=true

# \u0424\u043E\u0440\u043C\u0430\u0442 \u0434\u0430\u0442
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u043F\u043E\u0434\u043A\u043B\u044E\u0447\u0435\u043D\u0438\u044F \u043A \u0441\u0435\u0440\u0432\u0435\u0440\u0443 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043A\u0438
stats-server.url=${STATS_SERVER_URL:http://localhost:9090}